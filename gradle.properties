org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Downloaded libraries and build plugins are compared with the checksums in
# gradle/verification-metadata.xml. Locally a mismatch is only reported, so that Android Studio
# (which downloads extra files, e.g. sources) keeps working; the CI build passes
# "--dependency-verification strict" and fails instead.
org.gradle.dependency.verification=lenient
